<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Stats | MK Thunder Stats Centre</title>

<style>

* {
box-sizing: border-box;
}

body {
margin: 0;
min-height: 100vh;
font-family: Arial, Helvetica, sans-serif;
color: #ffffff;

background:
radial-gradient(circle at top, rgba(35,185,205,0.12), transparent 35%),
linear-gradient(180deg, #061116 0%, #0a1f27 45%, #0d2a33 100%);
}

.container {
width: min(1200px, 92%);
margin: auto;
}

/* HEADER */

header {
padding: 42px 20px 34px;
border-bottom: 1px solid rgba(49,220,198,0.25);
}

.header-content {
display: flex;
justify-content: space-between;
align-items: center;
gap: 30px;
}

.site-title {
font-size: clamp(40px, 7vw, 72px);
font-weight: 900;
font-style: italic;
margin: 0;
text-transform: uppercase;
}

.page-name {
color: #24e0c2;
font-size: 22px;
font-weight: 800;
letter-spacing: 6px;
margin-top: 8px;
text-transform: uppercase;
}

.header-logo {
width: 170px;
height: 170px;
object-fit: contain;
}

/* NAV */

nav {
border-bottom: 1px solid rgba(255,255,255,0.12);
}

.nav-inner {
display: flex;
overflow-x: auto;
}

.nav-inner a {
padding: 20px 24px;
text-transform: uppercase;
font-size: 13px;
font-weight: bold;
letter-spacing: 1px;
border-bottom: 3px solid transparent;
white-space: nowrap;
color: #f4ecc8;
text-decoration: none;
}

.nav-inner a:hover,
.nav-inner a.active {
color: #24e0c2;
border-bottom-color: #24e0c2;
}

/* MAIN */

main {
padding: 38px 0 60px;
}

.section-heading {
display: flex;
justify-content: space-between;
align-items: end;
gap: 20px;
margin-bottom: 24px;
}

.section-heading h1 {
margin: 0;
color: #24e0c2;
font-size: 30px;
text-transform: uppercase;
}

.season {
color: #ddd5b5;
font-size: 13px;
}

/* TABLE */

.stats-wrap {
overflow-x: auto;
border: 1px solid rgba(80,190,175,0.3);
border-radius: 6px;
background: rgba(5,22,28,0.7);
}

table {
width: 100%;
border-collapse: collapse;
min-width: 760px;
}

thead {
background: rgba(36,224,194,0.12);
}

th,
td {
padding: 14px 16px;
border-bottom: 1px solid rgba(255,255,255,0.08);
text-align: center;
}

th {
color: #f5edc9;
font-size: 12px;
text-transform: uppercase;
letter-spacing: 1px;
}

td {
font-size: 14px;
}

td.player {
text-align: left;
font-weight: 800;
}

td.number {
color: #f5edc9;
font-weight: 900;
}

td.points {
color: #24e0c2;
font-weight: 900;
}

tr:hover td {
background: rgba(36,224,194,0.05);
}

.message {
padding: 40px;
text-align: center;
color: #f5edc9;
}

/* FOOTER */

footer {
border-top: 1px solid rgba(36,224,194,0.25);
padding: 28px 0;
color: #ddd5b5;
font-size: 13px;
}

@media (max-width: 650px) {
.header-logo {
width: 110px;
height: 110px;
}

.site-title {
font-size: 40px;
}
}

</style>
</head>

<body>

<header>
<div class="container header-content">

<div>
<div class="site-title">MK Thunder</div>
<div class="page-name">Stats</div>
</div>

<img
src="thunder-logo.png"
alt="MK Thunder logo"
class="header-logo"
>

</div>
</header>

<nav>
<div class="container nav-inner">

<a href="index.html">Home</a>
<a href="fixtures.html">Fixtures</a>
<a href="#">Results</a>
<a href="players.html">Players</a>
<a href="stats.html" class="active">Stats</a>
<a href="#">Tables</a>
<a href="#">About</a>

</div>
</nav>

<main>
<div class="container">

<div class="section-heading">
<h1>Skater Stats</h1>
<div class="season">2026/27 Season</div>
</div>

<div id="stats-area">
<div class="message">
Loading player statistics...
</div>
</div>

</div>
</main>

<footer>
<div class="container">
MK Thunder Stats Centre · Independent fan statistics site · 2026/27
</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>

fetch("MK_Thunder_Stats_Master.xlsx")

.then(response => {

if (!response.ok) {
throw new Error("Excel workbook could not be loaded");
}

return response.arrayBuffer();

})

.then(arrayBuffer => {

const workbook = XLSX.read(arrayBuffer, {
type: "array",
cellDates: true
});

const playersSheet = workbook.Sheets["Players"];
const statsSheet = workbook.Sheets["Player Game Stats"];

if (!playersSheet || !statsSheet) {
throw new Error("Players or Player Game Stats sheet not found");
}

let players = XLSX.utils.sheet_to_json(playersSheet, {
range: 2,
defval: ""
});

let gameStats = XLSX.utils.sheet_to_json(statsSheet, {
range: 2,
defval: ""
});

function cleanRows(rows) {

return rows.map(row => {

const clean = {};

Object.keys(row).forEach(key => {
clean[String(key).trim()] = row[key];
});

return clean;

});

}

players = cleanRows(players);
gameStats = cleanRows(gameStats);

const playerMap = {};

players.forEach(player => {

const id = String(player["Player ID"]).trim();

if (!id) {
return;
}

playerMap[id] = {
id: id,
name: String(player["Name"]).trim(),
number: String(player["Number"]).trim(),
position: String(player["Position"]).trim(),
active: String(player["Active?"] || player["Active ?"])
.trim()
.toLowerCase(),
gp: 0,
goals: 0,
assists: 0,
points: 0,
pim: 0,
plusMinus: 0
};

});

gameStats.forEach(row => {

const playerId =
String(row["Player ID"]).trim();

if (!playerId || !playerMap[playerId]) {
return;
}

const dressed =
String(row["Dressed?"])
.trim()
.toLowerCase();

if (dressed === "yes") {
playerMap[playerId].gp += 1;
}

const goals =
Number(row["Goals"]) || 0;

const assists =
Number(row["Assists"]) || 0;

const pim =
Number(row["PIM"]) || 0;

const plusMinus =
Number(row["+/-"]) || 0;

playerMap[playerId].goals += goals;
playerMap[playerId].assists += assists;
playerMap[playerId].points += goals + assists;
playerMap[playerId].pim += pim;
playerMap[playerId].plusMinus += plusMinus;

});

let skaters =
Object.values(playerMap)
.filter(player =>
player.active === "yes" &&
player.position.toLowerCase() !== "netminder"
);

skaters.sort((a, b) => {

if (b.points !== a.points) {
return b.points - a.points;
}

if (b.goals !== a.goals) {
return b.goals - a.goals;
}

return a.name.localeCompare(b.name);

});

const statsArea =
document.getElementById("stats-area");

if (skaters.length === 0) {

statsArea.innerHTML = `
<div class="message">
No skater statistics currently available.
</div>
`;

return;
}

let rowsHTML = "";

skaters.forEach(player => {

const plusMinusText =
player.plusMinus > 0
? `+${player.plusMinus}`
: player.plusMinus;

rowsHTML += `
<tr>
<td class="number">${player.number}</td>
<td class="player">${player.name}</td>
<td>${player.gp}</td>
<td>${player.goals}</td>
<td>${player.assists}</td>
<td class="points">${player.points}</td>
<td>${player.pim}</td>
<td>${plusMinusText}</td>
</tr>
`;

});

statsArea.innerHTML = `

<div class="stats-wrap">

<table>

<thead>
<tr>
<th>#</th>
<th>Player</th>
<th>GP</th>
<th>G</th>
<th>A</th>
<th>PTS</th>
<th>PIM</th>
<th>+/-</th>
</tr>
</thead>

<tbody>
${rowsHTML}
</tbody>

</table>

</div>

`;

})

.catch(error => {

console.error(
"Could not load player stats:",
error
);

document.getElementById(
"stats-area"
).innerHTML = `
<div class="message">
Player statistics could not be loaded from Excel.
</div>
`;

});

</script>

</body>
</html>
