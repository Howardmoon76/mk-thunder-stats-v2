<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fixtures | MK Thunder Stats Centre</title>

<style>

* {
box-sizing: border-box;
}

:root {
--bg: #050b0e;
--panel: #0a151a;
--line: #29424a;
--teal: #22d3df;
--white: #f5f7f8;
--muted: #91a4aa;
}

body {
margin: 0;
font-family: Arial, Helvetica, sans-serif;
background:
radial-gradient(circle at top right, rgba(34,211,223,.08), transparent 30%),
linear-gradient(180deg, #061015 0%, #03080b 100%);
color: var(--white);
min-height: 100vh;
}

a {
color: inherit;
text-decoration: none;
}

.container {
width: min(1180px, calc(100% - 32px));
margin: auto;
}


/* HEADER */

.page-header {
padding: 42px 0 34px;
border-bottom: 1px solid var(--line);
}

.header-inner {
display: flex;
justify-content: space-between;
align-items: center;
gap: 30px;
}

.page-header h1 {
margin: 0;
font-size: clamp(40px, 7vw, 72px);
font-weight: 900;
font-style: italic;
}

.page-header h2 {
margin: 8px 0 0;
color: var(--teal);
text-transform: uppercase;
letter-spacing: 6px;
}

.header-logo {
width: 170px;
height: 170px;
object-fit: contain;
}


/* NAV */

nav {
background: #040b0e;
border-bottom: 1px solid var(--line);
}

.nav-inner {
display: flex;
overflow-x: auto;
}

.nav-inner a {
padding: 20px 24px;
text-transform: uppercase;
font-size: 13px;
font-weight: bold;
letter-spacing: 1px;
border-bottom: 3px solid transparent;
white-space: nowrap;
}

.nav-inner a:hover,
.nav-inner a.active {
color: var(--teal);
border-bottom-color: var(--teal);
}


/* MAIN */

main {
padding: 30px 0 60px;
}

.section-heading {
display: flex;
justify-content: space-between;
align-items: end;
margin-bottom: 20px;
}

.section-heading h3 {
margin: 0;
color: var(--teal);
font-size: 24px;
text-transform: uppercase;
}

.section-heading span {
color: var(--muted);
font-size: 13px;
}


/* FIXTURES */

.fixture-list {
display: grid;
gap: 16px;
}

.fixture-card {
border: 1px solid var(--line);
background:
linear-gradient(145deg, rgba(10,25,31,.97), rgba(5,13,17,.98));
border-radius: 5px;
padding: 22px;
}

.fixture-top {
display: flex;
justify-content: space-between;
gap: 16px;
align-items: center;
border-bottom: 1px solid var(--line);
padding-bottom: 14px;
margin-bottom: 20px;
}

.fixture-date {
font-weight: 900;
font-size: 18px;
}

.competition {
color: var(--teal);
text-transform: uppercase;
font-weight: bold;
font-size: 12px;
}

.fixture-matchup {
display: grid;
grid-template-columns: 1fr auto 1fr;
gap: 24px;
align-items: center;
text-align: center;
}

.team-logo {
width: 100px;
height: 100px;
object-fit: contain;
display: block;
margin: 0 auto 10px;
}

.team-name {
font-weight: 900;
text-transform: uppercase;
}

.vs {
font-size: 30px;
font-weight: 900;
}

.fixture-details {
margin-top: 22px;
text-align: center;
color: var(--muted);
line-height: 1.8;
}

.home-away {
display: inline-block;
margin-top: 14px;
padding: 7px 12px;
border: 1px solid var(--teal);
color: var(--teal);
text-transform: uppercase;
font-size: 11px;
font-weight: bold;
letter-spacing: 1px;
}

.empty-message {
border: 1px solid var(--line);
background: var(--panel);
padding: 35px;
text-align: center;
color: var(--muted);
}


/* FOOTER */

footer {
border-top: 1px solid var(--line);
background: #020608;
padding: 30px 0;
color: var(--muted);
font-size: 12px;
}


/* MOBILE */

@media (max-width: 650px) {

.header-logo {
width: 100px;
height: 100px;
}

.fixture-matchup {
gap: 10px;
}

.team-logo {
width: 72px;
height: 72px;
}

.team-name {
font-size: 12px;
}

.vs {
font-size: 22px;
}

}

</style>
</head>

<body>


<header class="page-header">

<div class="container header-inner">

<div>
<h1>MK THUNDER</h1>
<h2>Fixtures</h2>
</div>

<img
src="thunder-logo.png"
alt="MK Thunder logo"
class="header-logo"
>

</div>

</header>


<nav>

<div class="container nav-inner">

<a href="index.html">Home</a>
<a class="active" href="fixtures.html">Fixtures</a>
<a href="#">Results</a>
<a href="#">Players</a>
<a href="#">Stats</a>
<a href="#">Tables</a>
<a href="#">About</a>

</div>

</nav>


<main>

<div class="container">

<div class="section-heading">
<h3>Upcoming Fixtures</h3>
<span>2026/27 Season</span>
</div>

<div id="fixture-list" class="fixture-list">

<div class="empty-message">
Loading fixtures...
</div>

</div>

</div>

</main>


<footer>

<div class="container">
MK Thunder Stats Centre · Independent fan statistics site · 2026/27
</div>

</footer>


<script>

fetch("data.json")
.then(response => response.json())
.then(data => {

const fixtureList =
document.getElementById("fixture-list");

const thunder =
data.teams.find(team => team.id === "T001");

const upcomingGames = data.games
.filter(game =>
game.status.toLowerCase() === "upcoming"
)
.sort((a, b) => {

const dateA =
new Date(`${a.date}T${a.faceoff}`);

const dateB =
new Date(`${b.date}T${b.faceoff}`);

return dateA - dateB;

});

if (upcomingGames.length === 0) {

fixtureList.innerHTML = `
<div class="empty-message">
No upcoming fixtures currently listed.
</div>
`;

return;
}

fixtureList.innerHTML = "";

upcomingGames.forEach(game => {

const opponent =
data.teams.find(
team => team.id === game.opponentId
);

if (!opponent || !thunder) return;

const date =
new Date(`${game.date}T${game.faceoff}`);

const formattedDate =
date.toLocaleDateString("en-GB", {
weekday: "long",
day: "numeric",
month: "long",
year: "numeric"
});

const home =
game.homeAway.toUpperCase() === "H";

const leftTeam =
home ? thunder : opponent;

const rightTeam =
home ? opponent : thunder;

const locationText =
home ? "HOME" : "AWAY";

const card =
document.createElement("div");

card.className = "fixture-card";

card.innerHTML = `

<div class="fixture-top">

<div class="fixture-date">
${formattedDate}
</div>

<div class="competition">
${game.competition}
</div>

</div>


<div class="fixture-matchup">

<div>
<img
src="${leftTeam.logo}"
alt="${leftTeam.name} logo"
class="team-logo"
>
<div class="team-name">
${leftTeam.name}
</div>
</div>


<div class="vs">
VS
</div>


<div>
<img
src="${rightTeam.logo}"
alt="${rightTeam.name} logo"
class="team-logo"
>
<div class="team-name">
${rightTeam.name}
</div>
</div>

</div>


<div class="fixture-details">

Face-off: <strong>${game.faceoff}</strong><br>

${game.venue}

<br>

<span class="home-away">
${locationText}
</span>

</div>

`;

fixtureList.appendChild(card);

});

})

.catch(error => {

console.error(error);

document.getElementById("fixture-list").innerHTML = `
<div class="empty-message">
Fixtures could not be loaded.
</div>
`;

});

</script>


</body>
</html>
