<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fixtures | MK Thunder Stats Centre</title>

<style>

* {
box-sizing: border-box;
}

:root {
--bg: #050b0e;
--panel: #0a151a;
--line: #29424a;
--teal: #22d3df;
--white: #f5f7f8;
--muted: #91a4aa;
}

body {
margin: 0;
font-family: Arial, Helvetica, sans-serif;
background:
radial-gradient(circle at top right, rgba(34,211,223,.08), transparent 30%),
linear-gradient(180deg, #061015 0%, #03080b 100%);
color: var(--white);
min-height: 100vh;
}

a {
color: inherit;
text-decoration: none;
}

.container {
width: min(1180px, calc(100% - 32px));
margin: auto;
}


/* HEADER */

.page-header {
padding: 42px 0 34px;
border-bottom: 1px solid var(--line);
}

.header-inner {
display: flex;
justify-content: space-between;
align-items: center;
gap: 30px;
}

.page-header h1 {
margin: 0;
font-size: clamp(40px, 7vw, 72px);
font-weight: 900;
font-style: italic;
}

.page-header h2 {
margin: 8px 0 0;
color: var(--teal);
text-transform: uppercase;
letter-spacing: 6px;
}

.header-logo {
width: 170px;
height: 170px;
object-fit: contain;
}


/* NAV */

nav {
background: #040b0e;
border-bottom: 1px solid var(--line);
}

.nav-inner {
display: flex;
overflow-x: auto;
}

.nav-inner a {
padding: 20px 24px;
text-transform: uppercase;
font-size: 13px;
font-weight: bold;
letter-spacing: 1px;
border-bottom: 3px solid transparent;
white-space: nowrap;
}

.nav-inner a:hover,
.nav-inner a.active {
color: var(--teal);
border-bottom-color: var(--teal);
}


/* MAIN */

main {
padding: 30px 0 60px;
}

.section-heading {
display: flex;
justify-content: space-between;
align-items: end;
margin-bottom: 20px;
}

.section-heading h3 {
margin: 0;
color: var(--teal);
font-size: 24px;
text-transform: uppercase;
}

.section-heading span {
color: var(--muted);
font-size: 13px;
}


/* FIXTURES */

.fixture-list {
display: grid;
gap: 16px;
}

.fixture-card {
border: 1px solid var(--line);
background:
linear-gradient(145deg, rgba(10,25,31,.97), rgba(5,13,17,.98));
border-radius: 5px;
padding: 22px;
}

.fixture-top {
display: flex;
justify-content: space-between;
gap: 16px;
align-items: center;
border-bottom: 1px solid var(--line);
padding-bottom: 14px;
margin-bottom: 20px;
}

.fixture-date {
font-weight: 900;
font-size: 18px;
}

.competition {
color: var(--teal);
text-transform: uppercase;
font-weight: bold;
font-size: 12px;
}

.fixture-matchup {
display: grid;
grid-template-columns: 1fr auto 1fr;
gap: 24px;
align-items: center;
text-align: center;
}

.team-logo {
width: 100px;
height: 100px;
object-fit: contain;
display: block;
margin: 0 auto 10px;
}

.team-name {
font-weight: 900;
text-transform: uppercase;
}

.vs {
font-size: 30px;
font-weight: 900;
}

.fixture-details {
margin-top: 22px;
text-align: center;
color: var(--muted);
line-height: 1.8;
}

.home-away {
display: inline-block;
margin-top: 14px;
padding: 7px 12px;
border: 1px solid var(--teal);
color: var(--teal);
text-transform: uppercase;
font-size: 11px;
font-weight: bold;
letter-spacing: 1px;
}

.empty-message {
border: 1px solid var(--line);
background: var(--panel);
padding: 35px;
text-align: center;
color: var(--muted);
}


/* FOOTER */

footer {
border-top: 1px solid var(--line);
background: #020608;
padding: 30px 0;
color: var(--muted);
font-size: 12px;
}


/* MOBILE */

@media (max-width: 650px) {

.header-logo {
width: 100px;
height: 100px;
}

.fixture-matchup {
gap: 10px;
}

.team-logo {
width: 72px;
height: 72px;
}

.team-name {
font-size: 12px;
}

.vs {
font-size: 22px;
}

}

</style>
</head>

<body>


<header class="page-header">

<div class="container header-inner">

<div>
<h1>MK THUNDER</h1>
<h2>Fixtures</h2>
</div>

<img
src="thunder-logo.png"
alt="MK Thunder logo"
class="header-logo"
>

</div>

</header>


<nav>

<div class="container nav-inner">

<a href="index.html">Home</a>
<a class="active" href="fixtures.html">Fixtures</a>
<a href="#">Results</a>
<a href="#">Players</a>
<a href="#">Stats</a>
<a href="#">Tables</a>
<a href="#">About</a>

</div>

</nav>


<main>

<div class="container">

<div class="section-heading">
<h3>Upcoming Fixtures</h3>
<span>2026/27 Season</span>
</div>

<div id="fixture-list" class="fixture-list">

<div class="empty-message">
Loading fixtures...
</div>

</div>

</div>

</main>


<footer>

<div class="container">
MK Thunder Stats Centre · Independent fan statistics site · 2026/27
</div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
fetch("MK_Thunder_Stats_Master.xlsx")
.then(response => {
if (!response.ok) {
throw new Error("Excel workbook could not be loaded");
}
return response.arrayBuffer();
})
.then(arrayBuffer => {

const workbook = XLSX.read(arrayBuffer, {
type: "array",
cellDates: true
});

const teamsSheet = workbook.Sheets["Teams"];
const gamesSheet = workbook.Sheets["Games"];

if (!teamsSheet || !gamesSheet) {
throw new Error("Teams or Games sheet not found");
}

// Row 3 contains the column headings in your workbook
const teams = XLSX.utils.sheet_to_json(teamsSheet, {
range: 2,
defval: ""
});

const games = XLSX.utils.sheet_to_json(gamesSheet, {
range: 2,
defval: ""
});

const fixtureList =
document.getElementById("fixture-list");

const thunder = teams.find(team =>
String(team["Team ID"]).trim() === "T001"
);

if (!thunder) {
throw new Error("MK Thunder T001 not found");
}

const upcomingGames = games
.filter(game =>
String(game["Status"]).trim().toLowerCase() === "upcoming"
)
.sort((a, b) =>
new Date(a["Date"]) - new Date(b["Date"])
);

if (upcomingGames.length === 0) {
fixtureList.innerHTML = `
<div class="empty-message">
No upcoming fixtures currently listed.
</div>
`;
return;
}

fixtureList.innerHTML = "";

upcomingGames.forEach(game => {

const opponentId =
String(game["Opponent ID"]).trim();

const opponent = teams.find(team =>
String(team["Team ID"]).trim() === opponentId
);

if (!opponent) {
console.warn("Opponent not found:", opponentId);
return;
}

// DATE
let rawDate = game["Date"];
let date;

if (rawDate instanceof Date) {
date = rawDate;
} else if (typeof rawDate === "number") {
const parsed = XLSX.SSF.parse_date_code(rawDate);
date = new Date(
parsed.y,
parsed.m - 1,
parsed.d
);
} else {
date = new Date(rawDate);
}
const formattedDate =
date.toLocaleDateString("en-GB", {
weekday: "long",
day: "numeric",
month: "long",
year: "numeric"
});

// FACE-OFF TIME
let faceoff = game["Face-off"];

if (faceoff instanceof Date) {

faceoff = faceoff.toLocaleTimeString("en-GB", {
hour: "2-digit",
minute: "2-digit"
});

} else if (typeof faceoff === "number") {

const totalMinutes =
Math.round(faceoff * 24 * 60);

const hours =
Math.floor(totalMinutes / 60) % 24;

const minutes =
totalMinutes % 60;

faceoff =
String(hours).padStart(2, "0") +
":" +
String(minutes).padStart(2, "0");

} else {
faceoff = String(faceoff);
}

// HOME / AWAY
const home =
String(game["H/A"]).trim().toUpperCase() === "H";

const thunderTeam = {
name: thunder["Team Name"],
logo: thunder["Logo file"]
};

const opponentTeam = {
name: opponent["Team Name"],
logo: opponent["Logo file"]
};

const leftTeam =
home ? thunderTeam : opponentTeam;

const rightTeam =
home ? opponentTeam : thunderTeam;

const locationText =
home ? "HOME" : "AWAY";

// BUILD FIXTURE CARD
const card =
document.createElement("div");

card.className = "fixture-card";

card.innerHTML = `
<div class="fixture-top">

<div class="fixture-date">
${formattedDate}
</div>

<div class="competition">
${game["Competition"]}
</div>

</div>

<div class="fixture-matchup">

<div>
<img
src="${leftTeam.logo}"
alt="${leftTeam.name} logo"
class="team-logo"
>
<div class="team-name">
${leftTeam.name}
</div>
</div>

<div class="vs">
VS
</div>

<div>
<img
src="${rightTeam.logo}"
alt="${rightTeam.name} logo"
class="team-logo"
>
<div class="team-name">
${rightTeam.name}
</div>
</div>

</div>

<div class="fixture-details">

Face-off:
<strong>${faceoff}</strong><br>

${game["Venue"]}

<br>

<span class="home-away">
${locationText}
</span>

</div>
`;

fixtureList.appendChild(card);
});

})
.catch(error => {

console.error(
"Could not read Excel workbook:",
error
);

document.getElementById("fixture-list").innerHTML = `
<div class="empty-message">
Fixtures could not be loaded from Excel.
</div>
`;

});
</script>


</body>
</html>
