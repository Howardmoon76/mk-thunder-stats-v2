<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Results | MK Thunder Stats Centre</title>

<style>

* {
box-sizing: border-box;
}

body {
margin: 0;
min-height: 100vh;
font-family: Arial, Helvetica, sans-serif;
color: #ffffff;

background:
radial-gradient(circle at top, rgba(35,185,205,0.12), transparent 35%),
linear-gradient(180deg, #061116 0%, #0a1f27 45%, #0d2a33 100%);
}

.container {
width: min(1200px, 92%);
margin: auto;
}

/* HEADER */

header {
padding: 42px 20px 34px;
border-bottom: 1px solid rgba(49,220,198,0.25);
}

.header-content {
display: flex;
justify-content: space-between;
align-items: center;
gap: 30px;
}

.site-title {
font-size: clamp(40px, 7vw, 72px);
font-weight: 900;
font-style: italic;
margin: 0;
text-transform: uppercase;
}

.page-name {
color: #24e0c2;
font-size: 22px;
font-weight: 800;
letter-spacing: 6px;
margin-top: 8px;
text-transform: uppercase;
}

.header-logo {
width: 170px;
height: 170px;
object-fit: contain;
}

/* NAV */

nav {
border-bottom: 1px solid rgba(255,255,255,0.12);
}

.nav-inner {
display: flex;
overflow-x: auto;
}

.nav-inner a {
padding: 20px 24px;
text-transform: uppercase;
font-size: 13px;
font-weight: bold;
letter-spacing: 1px;
border-bottom: 3px solid transparent;
white-space: nowrap;
color: #f4ecc8;
text-decoration: none;
}

.nav-inner a:hover,
.nav-inner a.active {
color: #24e0c2;
border-bottom-color: #24e0c2;
}

/* MAIN */

main {
padding: 38px 0 60px;
}

.section-heading {
display: flex;
justify-content: space-between;
align-items: end;
gap: 20px;
margin-bottom: 24px;
}

.section-heading h1 {
margin: 0;
color: #24e0c2;
font-size: 30px;
text-transform: uppercase;
}

.season {
color: #ddd5b5;
font-size: 13px;
}

/* RESULT CARDS */

.result-list {
display: grid;
gap: 18px;
}

.result-card {
border: 1px solid rgba(80,190,175,0.3);
border-radius: 6px;
background:
linear-gradient(
145deg,
rgba(10,25,31,.97),
rgba(5,13,17,.98)
);
padding: 22px;
}

.result-top {
display: flex;
justify-content: space-between;
gap: 16px;
align-items: center;
border-bottom: 1px solid rgba(255,255,255,0.08);
padding-bottom: 14px;
margin-bottom: 20px;
}

.result-date {
font-weight: 900;
font-size: 18px;
}

.competition {
color: #24e0c2;
text-transform: uppercase;
font-weight: bold;
font-size: 12px;
}

.matchup {
display: grid;
grid-template-columns: 1fr auto 1fr;
gap: 24px;
align-items: center;
text-align: center;
}

.team-logo {
width: 100px;
height: 100px;
object-fit: contain;
display: block;
margin: 0 auto 10px;
}

.team-name {
font-weight: 900;
text-transform: uppercase;
}

.score {
font-size: 42px;
font-weight: 900;
color: #f5edc9;
white-space: nowrap;
}

.result-details {
margin-top: 22px;
text-align: center;
color: #ddd5b5;
line-height: 1.8;
}

.result-badge {
display: inline-block;
margin-top: 14px;
padding: 7px 12px;
border: 1px solid #24e0c2;
color: #24e0c2;
text-transform: uppercase;
font-size: 11px;
font-weight: bold;
letter-spacing: 1px;
}

.win {
color: #24e0c2;
}

.loss {
color: #f5edc9;
}

.message {
padding: 40px;
text-align: center;
color: #f5edc9;
border: 1px solid rgba(80,190,175,0.3);
}

/* FOOTER */

footer {
border-top: 1px solid rgba(36,224,194,0.25);
padding: 28px 0;
color: #ddd5b5;
font-size: 13px;
}

@media (max-width: 650px) {

.header-logo {
width: 110px;
height: 110px;
}

.site-title {
font-size: 40px;
}

.team-logo {
width: 72px;
height: 72px;
}

.score {
font-size: 30px;
}

.team-name {
font-size: 12px;
}
}

</style>
</head>

<body>

<header>
<div class="container header-content">

<div>
<div class="site-title">MK Thunder</div>
<div class="page-name">Results</div>
</div>

<img
src="thunder-logo.png"
alt="MK Thunder logo"
class="header-logo"
>

</div>
</header>

<nav>
<div class="container nav-inner">

<a href="index.html">Home</a>
<a href="fixtures.html">Fixtures</a>
<a href="results.html" class="active">Results</a>
<a href="players.html">Players</a>
<a href="stats.html">Stats</a>
<a href="tables.html">Tables</a>
<a href="about.html">About</a>

</div>
</nav>

<main>
<div class="container">

<div class="section-heading">
<h1>Results</h1>
<div class="season">2026/27 Season</div>
</div>

<div id="result-list" class="result-list">

<div class="message">
Loading results...
</div>

</div>

</div>
</main>

<footer>
<div class="container">
MK Thunder Stats Centre · Independent fan statistics site · 2026/27
</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>

fetch("MK_Thunder_Stats_Master.xlsx?v=" + Date.now())

.then(response => {

if (!response.ok) {
throw new Error("Excel workbook could not be loaded");
}

return response.arrayBuffer();

})

.then(arrayBuffer => {

const workbook = XLSX.read(arrayBuffer, {
type: "array",
cellDates: true
});

const teamsSheet = workbook.Sheets["Teams"];
const gamesSheet = workbook.Sheets["Games"];

if (!teamsSheet || !gamesSheet) {
throw new Error("Teams or Games sheet not found");
}

let teams = XLSX.utils.sheet_to_json(teamsSheet, {
range: 2,
defval: ""
});

let games = XLSX.utils.sheet_to_json(gamesSheet, {
range: 2,
defval: ""
});

function cleanRows(rows) {

return rows.map(row => {

const clean = {};

Object.keys(row).forEach(key => {
clean[String(key).trim()] = row[key];
});

return clean;

});

}

teams = cleanRows(teams);
games = cleanRows(games);

function readExcelDate(value) {

if (value instanceof Date) {
return value;
}

if (typeof value === "number") {

const parsed =
XLSX.SSF.parse_date_code(value);

return new Date(
parsed.y,
parsed.m - 1,
parsed.d
);
}

const text =
String(value).trim();

const match = text.match(
/^(\d{1,2})-([A-Za-z]{3})-(\d{2,4})$/
);

if (match) {

const months = {
Jan: 0,
Feb: 1,
Mar: 2,
Apr: 3,
May: 4,
Jun: 5,
Jul: 6,
Aug: 7,
Sep: 8,
Oct: 9,
Nov: 10,
Dec: 11
};

let year =
Number(match[3]);

if (year < 100) {
year += 2000;
}

return new Date(
year,
months[match[2]],
Number(match[1])
);

}

return new Date(text);
}

const thunder = teams.find(team =>
String(team["Team ID"]).trim() === "T001"
);

if (!thunder) {
throw new Error("MK Thunder not found");
}

const completedGames = games
.filter(game => {

const thunderScore =
String(game["Thunder Score"]).trim();

const opponentScore =
String(game["Opponent Score"]).trim();

return thunderScore !== "" &&
opponentScore !== "";

})
.sort((a, b) =>
readExcelDate(b["Date"]) -
readExcelDate(a["Date"])
);

const resultList =
document.getElementById("result-list");

if (completedGames.length === 0) {

resultList.innerHTML = `
<div class="message">
No completed games currently listed.
</div>
`;

return;
}

resultList.innerHTML = "";

completedGames.forEach(game => {

const opponentId =
String(game["Opponent ID"]).trim();

const opponent = teams.find(team =>
String(team["Team ID"]).trim() === opponentId
);

if (!opponent) {
return;
}

const date =
readExcelDate(game["Date"]);

const formattedDate =
date.toLocaleDateString("en-GB", {
weekday: "long",
day: "numeric",
month: "long",
year: "numeric"
});

const home =
String(game["H/A"])
.trim()
.toUpperCase() === "H";

const thunderScore =
Number(game["Thunder Score"]) || 0;

const opponentScore =
Number(game["Opponent Score"]) || 0;

const thunderTeam = {
name: thunder["Team Name"],
logo: thunder["Logo file"]
};

const opponentTeam = {
name: opponent["Team Name"],
logo: opponent["Logo file"]
};

const leftTeam =
home ? thunderTeam : opponentTeam;

const rightTeam =
home ? opponentTeam : thunderTeam;

const leftScore =
home ? thunderScore : opponentScore;

const rightScore =
home ? opponentScore : thunderScore;

let resultText =
String(game["Result"]).trim();

if (!resultText) {

if (thunderScore > opponentScore) {
resultText = "W";
}
else if (thunderScore < opponentScore) {
resultText = "L";
}
else {
resultText = "T";
}

}

const resultClass =
resultText.toUpperCase().startsWith("W")
? "win"
: "loss";

const locationText =
home ? "HOME" : "AWAY";

const otSo =
String(game["OT/SO?"]).trim();

const card =
document.createElement("div");

card.className =
"result-card";

card.innerHTML = `

<div class="result-top">

<div class="result-date">
${formattedDate}
</div>

<div class="competition">
${game["Competition"]}
</div>

</div>

<div class="matchup">

<div>
<img
src="${leftTeam.logo}"
alt="${leftTeam.name} logo"
class="team-logo"
>

<div class="team-name">
${leftTeam.name}
</div>
</div>

<div class="score">
${leftScore} - ${rightScore}
</div>

<div>
<img
src="${rightTeam.logo}"
alt="${rightTeam.name} logo"
class="team-logo"
>

<div class="team-name">
${rightTeam.name}
</div>
</div>

</div>

<div class="result-details">

${game["Venue"]}

<br>

<span class="result-badge">
${locationText}
</span>

<span class="result-badge ${resultClass}">
${resultText}
</span>

${
otSo
? `
<span class="result-badge">
${otSo}
</span>
`
: ""
}

</div>

`;

resultList.appendChild(card);

});

})

.catch(error => {

console.error(
"Could not load results:",
error
);

document.getElementById(
"result-list"
).innerHTML = `

<div class="message">
Results could not be loaded from Excel.
</div>

`;

});

</script>

</body>
</html>
