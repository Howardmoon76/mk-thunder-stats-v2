<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tables | MK Thunder Stats Centre</title>

<style>

* {
box-sizing: border-box;
}

body {
margin: 0;
min-height: 100vh;
font-family: Arial, Helvetica, sans-serif;
color: #ffffff;

background:
radial-gradient(circle at top, rgba(35,185,205,0.12), transparent 35%),
linear-gradient(180deg, #061116 0%, #0a1f27 45%, #0d2a33 100%);
}

.container {
width: min(1200px, 92%);
margin: auto;
}

/* HEADER */

header {
padding: 42px 20px 34px;
border-bottom: 1px solid rgba(49,220,198,0.25);
}

.header-content {
display: flex;
justify-content: space-between;
align-items: center;
gap: 30px;
}

.site-title {
font-size: clamp(40px, 7vw, 72px);
font-weight: 900;
font-style: italic;
margin: 0;
text-transform: uppercase;
}

.page-name {
color: #24e0c2;
font-size: 22px;
font-weight: 800;
letter-spacing: 6px;
margin-top: 8px;
text-transform: uppercase;
}

.header-logo {
width: 170px;
height: 170px;
object-fit: contain;
}

/* NAV */

nav {
border-bottom: 1px solid rgba(255,255,255,0.12);
}

.nav-inner {
display: flex;
overflow-x: auto;
}

.nav-inner a {
padding: 20px 24px;
text-transform: uppercase;
font-size: 13px;
font-weight: bold;
letter-spacing: 1px;
border-bottom: 3px solid transparent;
white-space: nowrap;
color: #f4ecc8;
text-decoration: none;
}

.nav-inner a:hover,
.nav-inner a.active {
color: #24e0c2;
border-bottom-color: #24e0c2;
}

/* MAIN */

main {
padding: 38px 0 60px;
}

.section-heading {
display: flex;
justify-content: space-between;
align-items: end;
gap: 20px;
margin-bottom: 24px;
}

.section-heading h1 {
margin: 0;
color: #24e0c2;
font-size: 30px;
text-transform: uppercase;
}

.season {
color: #ddd5b5;
font-size: 13px;
}

/* TABLE */

.table-wrap {
overflow-x: auto;
border: 1px solid rgba(80,190,175,0.3);
border-radius: 6px;
background: rgba(5,22,28,0.7);
}

table {
width: 100%;
border-collapse: collapse;
min-width: 820px;
}

thead {
background: rgba(36,224,194,0.12);
}

th,
td {
padding: 14px 16px;
border-bottom: 1px solid rgba(255,255,255,0.08);
text-align: center;
}

th {
color: #f5edc9;
font-size: 12px;
text-transform: uppercase;
letter-spacing: 1px;
}

td {
font-size: 14px;
}

td.team {
text-align: left;
font-weight: 800;
}

td.position,
td.points {
font-weight: 900;
}

td.points {
color: #24e0c2;
}

tr.mk-thunder td {
background: rgba(36,224,194,0.10);
}

tr.mk-thunder td.team {
color: #24e0c2;
}

.message {
padding: 40px;
text-align: center;
color: #f5edc9;
}

/* FOOTER */

footer {
border-top: 1px solid rgba(36,224,194,0.25);
padding: 28px 0;
color: #ddd5b5;
font-size: 13px;
}

@media (max-width: 650px) {

.header-logo {
width: 110px;
height: 110px;
}

.site-title {
font-size: 40px;
}

}

</style>
</head>

<body>

<header>
<div class="container header-content">

<div>
<div class="site-title">MK Thunder</div>
<div class="page-name">Tables</div>
</div>

<img
src="thunder-logo.png"
alt="MK Thunder logo"
class="header-logo"
>

</div>
</header>

<nav>
<div class="container nav-inner">

<a href="index.html">Home</a>
<a href="fixtures.html">Fixtures</a>
<a href="results.html">Results</a>
<a href="players.html">Players</a>
<a href="stats.html">Stats</a>
<a href="tables.html" class="active">Tables</a>
<a href="about.html">About</a>

</div>
</nav>

<main>
<div class="container">

<div class="section-heading">
<h1>League Table</h1>
<div class="season">2026/27 Season</div>
</div>

<div id="league-area">
<div class="message">Loading league table...</div>
</div>

<div class="section-heading" style="margin-top:45px;">
<h1>Cup Table</h1>
<div class="season">2026/27 Season</div>
</div>

<div id="cup-area">
<div class="message">Loading cup table...</div>
</div>

</div>
</main>

<footer>
<div class="container">
MK Thunder Stats Centre · Independent fan statistics site · 2026/27
</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>

fetch("MK_Thunder_Stats_Master.xlsx")

.then(response => {

if (!response.ok) {
throw new Error("Excel workbook could not be loaded");
}

return response.arrayBuffer();

})

.then(arrayBuffer => {

const workbook = XLSX.read(arrayBuffer, {
type: "array",
cellDates: true
});

const leagueSheet = workbook.Sheets["League Table"];
const cupSheet = workbook.Sheets["Cup Table"];

if (!leagueSheet || !cupSheet) {
throw new Error("League Table or Cup Table sheet not found");
}

let leagueRows = XLSX.utils.sheet_to_json(leagueSheet, {
range: 2,
defval: ""
});

let cupRows = XLSX.utils.sheet_to_json(cupSheet, {
range: 2,
defval: ""
});

function cleanRows(rows) {

return rows.map(row => {

const clean = {};

Object.keys(row).forEach(key => {
clean[String(key).trim()] = row[key];
});

return clean;

});

}

leagueRows = cleanRows(leagueRows);
cupRows = cleanRows(cupRows);

function prepareTable(rows) {

const teams = rows
.filter(row => String(row["Team"]).trim() !== "")
.map(row => ({
team: String(row["Team"]).trim(),
gp: Number(row["GP"]) || 0,
w: Number(row["W"]) || 0,
otw: Number(row["OTW"]) || 0,
otl: Number(row["OTL"]) || 0,
l: Number(row["L"]) || 0,
gf: Number(row["GF"]) || 0,
ga: Number(row["GA"]) || 0,
gd: Number(row["GD"]) || 0,
pts: Number(row["PTS"]) || 0
}));

teams.sort((a, b) => {

if (b.pts !== a.pts) {
return b.pts - a.pts;
}

if (b.gd !== a.gd) {
return b.gd - a.gd;
}

if (b.gf !== a.gf) {
return b.gf - a.gf;
}

return a.team.localeCompare(b.team);

});

return teams;

}

function buildTable(rows) {

let rowsHTML = "";

rows.forEach((team, index) => {

const thunderClass =
team.team.toLowerCase() === "mk thunder"
? "mk-thunder"
: "";

const gdText =
team.gd > 0
? `+${team.gd}`
: team.gd;

rowsHTML += `
<tr class="${thunderClass}">
<td class="position">${index + 1}</td>
<td class="team">${team.team}</td>
<td>${team.gp}</td>
<td>${team.w}</td>
<td>${team.otw}</td>
<td>${team.otl}</td>
<td>${team.l}</td>
<td>${team.gf}</td>
<td>${team.ga}</td>
<td>${gdText}</td>
<td class="points">${team.pts}</td>
</tr>
`;

});

return `
<div class="table-wrap">

<table>

<thead>
<tr>
<th>#</th>
<th>Team</th>
<th>GP</th>
<th>W</th>
<th>OTW</th>
<th>OTL</th>
<th>L</th>
<th>GF</th>
<th>GA</th>
<th>GD</th>
<th>PTS</th>
</tr>
</thead>

<tbody>
${rowsHTML}
</tbody>

</table>

</div>
`;

}

const league = prepareTable(leagueRows);
const cup = prepareTable(cupRows);

document.getElementById("league-area").innerHTML =
buildTable(league);

document.getElementById("cup-area").innerHTML =
buildTable(cup);

})

.catch(error => {

console.error(
"Could not load standings:",
error
);

document.getElementById("league-area").innerHTML = `
<div class="message">
League table could not be loaded from Excel.
</div>
`;

document.getElementById("cup-area").innerHTML = `
<div class="message">
Cup table could not be loaded from Excel.
</div>
`;

});

</script>

</body>
</html>
