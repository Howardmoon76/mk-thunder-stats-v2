<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Players | MK Thunder Stats Centre</title>

<style>

* {
box-sizing: border-box;
}

body {
margin: 0;
font-family: Arial, Helvetica, sans-serif;
background:
radial-gradient(circle at top, rgba(35,185,205,0.12), transparent 35%),
linear-gradient(180deg, #061116 0%, #0a1f27 45%, #0d2a33 100%);
color: #ffffff;
min-height: 100vh;
}

/* HEADER */

header {
padding: 42px 20px 34px;
border-bottom: 1px solid rgba(49, 220, 198, 0.25);
}

.container {
width: min(1200px, 92%);
margin: auto;
}

.header-content {
display: flex;
justify-content: space-between;
align-items: center;
gap: 30px;
}

.site-title {
font-size: clamp(40px, 7vw, 72px);
font-weight: 900;
font-style: italic;
margin: 0;
text-transform: uppercase;
}

.page-name {
color: #24e0c2;
font-size: 22px;
font-weight: 800;
letter-spacing: 6px;
margin-top: 8px;
text-transform: uppercase;
}

.header-logo {
width: 170px;
height: 170px;
object-fit: contain;
}

/* NAV */

nav {
border-bottom: 1px solid rgba(255,255,255,0.12);
}

.nav-inner {
display: flex;
align-items: center;
overflow-x: auto;
padding: 0;
}

nav a {
display: block;
padding: 20px 24px;
color: #f4ecc8;
text-decoration: none;
text-transform: uppercase;
font-size: 13px;
font-weight: bold;
letter-spacing: 1px;
white-space: nowrap;
border-bottom: 3px solid transparent;
}

nav a:hover,
nav a.active {
color: #24e0c2;
border-bottom-color: #24e0c2;
}

/* MAIN */

main {
padding: 38px 0 60px;
}

.section-heading {
display: flex;
justify-content: space-between;
align-items: end;
gap: 20px;
margin-bottom: 24px;
}

.section-heading h1 {
margin: 0;
color: #24e0c2;
font-size: 30px;
text-transform: uppercase;
}

.season {
color: #ddd5b5;
font-size: 13px;
}

/* POSITION SECTIONS */

.position-section {
margin-bottom: 46px;
}

.position-title {
font-size: 20px;
color: #f5edc9;
text-transform: uppercase;
letter-spacing: 2px;
padding-bottom: 12px;
margin-bottom: 20px;
border-bottom: 1px solid rgba(36,224,194,0.35);
}

/* PLAYER GRID */

.player-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
gap: 22px;
}

/* PLAYER CARD */

.player-card {
position: relative;
overflow: hidden;
min-height: 330px;

border: 1px solid rgba(80, 190, 175, 0.35);
border-radius: 6px;

background:
linear-gradient(
180deg,
rgba(15, 55, 64, 0.92),
rgba(5, 22, 28, 0.98)
);

transition: transform 0.2s ease, border-color 0.2s ease;
}

.player-card:hover {
transform: translateY(-4px);
border-color: #24e0c2;
}

/* PHOTO */

.player-photo-area {
height: 225px;
display: flex;
align-items: center;
justify-content: center;
overflow: hidden;
position: relative;

background:
radial-gradient(
circle at center,
rgba(36,224,194,0.16),
transparent 65%
);
}

.player-photo {
width: 100%;
height: 100%;
object-fit: cover;
object-position: top center;
}

.player-placeholder {
width: 115px;
height: 115px;
border: 2px solid #24e0c2;
border-radius: 50%;

display: flex;
align-items: center;
justify-content: center;

color: #24e0c2;
font-size: 38px;
font-weight: 900;
}

/* NUMBER */

.player-number {
position: absolute;
top: 14px;
left: 16px;

font-size: 36px;
font-weight: 900;

color: #f5edc9;

text-shadow: 0 2px 6px rgba(0,0,0,0.7);
}

/* INFO */

.player-info {
padding: 18px;
text-align: center;
}

.player-name {
color: #ffffff;
font-size: 19px;
font-weight: 900;
text-transform: uppercase;
margin-bottom: 7px;
}

.player-position {
color: #24e0c2;
font-size: 13px;
font-weight: 800;
text-transform: uppercase;
letter-spacing: 1px;
}

.player-note {
margin-top: 9px;
color: #f5edc9;
font-size: 12px;
text-transform: uppercase;
}

/* LOADING */

.message {
padding: 40px;
text-align: center;
color: #f5edc9;
border: 1px solid rgba(80,190,175,0.3);
}

/* FOOTER */

footer {
border-top: 1px solid rgba(36,224,194,0.25);
padding: 28px 0;
color: #ddd5b5;
font-size: 13px;
}

/* MOBILE */

@media (max-width: 650px) {

.nav-inner {
gap: 24px;
}

.player-grid {
grid-template-columns: repeat(2, 1fr);
gap: 12px;
}

.player-card {
min-height: 270px;
}

.player-photo-area {
height: 175px;
}

.player-name {
font-size: 15px;
}

.player-number {
font-size: 28px;
}
}

</style>
</head>

<body>

<header>
<div class="container header-content">

<div>
<div class="site-title">MK Thunder</div>
<div class="page-name">Players</div>
</div>

<img src="thunder-logo.png"
alt="MK Thunder logo"
class="header-logo">

</div>
</header>

<nav>
<div class="container nav-inner">

<a href="index.html">Home</a>
<a href="fixtures.html">Fixtures</a>
<a href="#">Results</a>
<a href="players.html" class="active">Players</a>
<a href="stats.html">Stats</a>
<a href="tables.html">Tables</a>
<a href="#">About</a>

</div>
</nav>

<main>

<div class="container">

<div class="section-heading">

<h1>MK Thunder Roster</h1>

<div class="season">
2026/27 Season
</div>

</div>

<div id="player-list">

<div class="message">
Loading players...
</div>

</div>

</div>

</main>

<footer>

<div class="container">

MK Thunder Stats Centre · Independent fan statistics site · 2026/27

</div>

</footer>


<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>

fetch("MK_Thunder_Stats_Master.xlsx")

.then(response => {

if (!response.ok) {
throw new Error("Excel workbook could not be loaded");
}

return response.arrayBuffer();

})

.then(arrayBuffer => {

const workbook = XLSX.read(arrayBuffer, {
type: "array",
cellDates: true
});

const playersSheet = workbook.Sheets["Players"];

if (!playersSheet) {
throw new Error("Players sheet not found");
}

/*
Row 3 contains the headings.
range: 2 tells SheetJS to start there.
*/

let players = XLSX.utils.sheet_to_json(
playersSheet,
{
range: 2,
defval: ""
}
);

/*
CLEAN COLUMN HEADINGS

This automatically removes spaces from the
beginning/end of every Excel heading.
*/

players = players.map(player => {

const cleanPlayer = {};

Object.keys(player).forEach(key => {

cleanPlayer[String(key).trim()] =
player[key];

});

return cleanPlayer;

});


/*
ONLY ACTIVE PLAYERS
*/

players = players.filter(player => {

const active =
String(player["Active?"] || player["Active ?"])
.trim()
.toLowerCase();

return active === "yes";

});


/*
SORT BY SHIRT NUMBER
*/

players.sort((a, b) => {

return Number(a["Number"]) -
Number(b["Number"]);

});


const playerList =
document.getElementById("player-list");


if (players.length === 0) {

playerList.innerHTML = `

<div class="message">
No active players currently listed.
</div>

`;

return;

}


/*
GROUP PLAYERS BY POSITION
*/

const groups = {

"Netminder": [],
"Defence": [],
"Forward": []

};


players.forEach(player => {

const position =
String(player["Position"]).trim();

if (!groups[position]) {
groups[position] = [];
}

groups[position].push(player);

});


playerList.innerHTML = "";


/*
DISPLAY ORDER
*/

const displayOrder = [
"Netminder",
"Defence",
"Forward"
];


displayOrder.forEach(position => {

const positionPlayers =
groups[position] || [];

if (positionPlayers.length === 0) {
return;
}


const section =
document.createElement("section");

section.className =
"position-section";


const title =
document.createElement("div");

title.className =
"position-title";

title.textContent =
position === "Netminder"
? "Netminders"
: position === "Defence"
? "Defence"
: "Forwards";


const grid =
document.createElement("div");

grid.className =
"player-grid";


positionPlayers.forEach(player => {

const card =
document.createElement("div");

card.className =
"player-card";


const name =
String(player["Name"]).trim();

const number =
String(player["Number"]).trim();

const photo =
String(player["Photo / URL"]).trim();

const note =
String(player["Notes"]).trim();


/*
INITIALS FOR PLACEHOLDER
*/

const initials =
name
.split(" ")
.map(word => word.charAt(0))
.join("")
.substring(0,2)
.toUpperCase();


let photoHTML;


if (photo) {

photoHTML = `

<img
class="player-photo"
src="${photo}"
alt="${name}"
onerror="
this.style.display='none';
this.nextElementSibling.style.display='flex';
"
>

<div
class="player-placeholder"
style="display:none;"
>
${initials}
</div>

`;

} else {

photoHTML = `

<div class="player-placeholder">
${initials}
</div>

`;

}


card.innerHTML = `

<div class="player-photo-area">

<div class="player-number">
${number}
</div>

${photoHTML}

</div>


<div class="player-info">

<div class="player-name">
${name}
</div>

<div class="player-position">
${position}
</div>

${
note
? `
<div class="player-note">
${note}
</div>
`
: ""
}

</div>

`;


grid.appendChild(card);

});


section.appendChild(title);
section.appendChild(grid);

playerList.appendChild(section);

});

})

.catch(error => {

console.error(
"Could not read Players sheet:",
error
);

document.getElementById(
"player-list"
).innerHTML = `

<div class="message">
Players could not be loaded from Excel.
</div>

`;

});

</script>

</body>
</html>
