<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Match Report | MK Thunder Stats Centre</title>
<style>
*{box-sizing:border-box}
:root{--aqua:#24e0c2;--cream:#f5edc9;--muted:#c0d3d5;--stroke:rgba(80,190,175,.35)}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:#fff;background:radial-gradient(circle at top,rgba(35,185,205,.12),transparent 35%),linear-gradient(180deg,#061116 0%,#0a1f27 45%,#0d2a33 100%)}
.container{width:min(1200px,92%);margin:auto}
header{padding:38px 20px 32px;border-bottom:1px solid rgba(49,220,198,.25)}
.header-content{display:flex;justify-content:space-between;align-items:center;gap:24px}
.site-title{font-size:clamp(38px,7vw,70px);font-weight:900;font-style:italic;text-transform:uppercase;line-height:1.05}
.page-name{color:var(--aqua);font-size:21px;font-weight:800;letter-spacing:6px;margin-top:8px;text-transform:uppercase}
.header-logo{height:150px;width:150px;object-fit:contain}
nav{border-bottom:1px solid rgba(255,255,255,.12)}
.nav-inner{display:flex;align-items:center;overflow-x:auto}
nav a{display:block;flex:0 0 auto;padding:19px 22px;color:var(--cream);text-decoration:none;text-transform:uppercase;font-size:13px;font-weight:bold;letter-spacing:1px;white-space:nowrap;border-bottom:3px solid transparent}
nav a:hover,nav a.active{color:var(--aqua);border-bottom-color:var(--aqua)}
main{padding:30px 0 65px}
a{color:var(--aqua)}
.back{display:inline-flex;align-items:center;gap:7px;margin-bottom:20px;text-decoration:none;color:var(--cream);font-weight:800;font-size:14px}
.back:hover{color:var(--aqua)}
.hero{background:linear-gradient(145deg,rgba(15,55,64,.95),rgba(4,17,22,.98));border:1px solid var(--stroke);border-radius:12px;padding:29px 25px 24px}
.meta{color:var(--aqua);text-align:center;font-size:12px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;line-height:1.8}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(145px,230px) minmax(0,1fr);align-items:center;gap:20px;margin-top:22px}
.team{text-align:center;min-width:0}
.team-logo{display:block;width:min(125px,100%);height:125px;object-fit:contain;margin:0 auto 12px}
.team-name{font-size:clamp(16px,2.5vw,25px);font-weight:900;text-transform:uppercase;overflow-wrap:anywhere}
.score{font-size:clamp(35px,7vw,72px);line-height:1;white-space:nowrap;text-align:center;font-weight:900;color:var(--cream);letter-spacing:-2px}
.final{text-align:center;font-size:12px;letter-spacing:2px;font-weight:900;color:var(--aqua);text-transform:uppercase;margin-bottom:11px}
.tags{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:25px}
.tag{border:1px solid rgba(36,224,194,.42);color:var(--cream);border-radius:4px;padding:7px 11px;font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase}
.summary{padding:18px 0 0;margin:18px 0 0;text-align:center;color:var(--muted);font-size:15px;border-top:1px solid rgba(255,255,255,.09);line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-top:24px}
.stat{padding:20px 10px;text-align:center;border:1px solid var(--stroke);background:linear-gradient(180deg,#103c45,#071b22);border-radius:8px}
.stat-val{font-size:clamp(24px,4vw,37px);font-weight:900;font-variant-numeric:tabular-nums}
.stat-label{margin-top:6px;color:var(--cream);font-size:11px;font-weight:900;letter-spacing:.5px;text-transform:uppercase}
.section-heading{font-size:22px;text-transform:uppercase;color:var(--aqua);margin:37px 0 17px}
.panel{border:1px solid var(--stroke);border-radius:9px;background:linear-gradient(145deg,rgba(9,36,44,.85),rgba(6,22,29,.93));padding:19px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.panel h3{color:var(--cream);margin:2px 0 17px;font-size:15px;text-transform:uppercase;letter-spacing:1px}
.scoring-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:11px 0;border-top:1px solid rgba(255,255,255,.08)}
.scoring-row a{color:#fff;text-decoration:none;font-weight:800;overflow-wrap:anywhere}
.scoring-row a:hover{text-decoration:underline;color:var(--aqua)}
.scoring-row .qty{font-size:20px;color:var(--aqua);font-weight:900;font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto;border:1px solid var(--stroke);border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:640px;font-size:14px}
th,td{padding:13px 13px;border-bottom:1px solid rgba(255,255,255,.09);text-align:left}
th{background:#0e3944;color:var(--cream);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.8px}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(36,224,194,.065)}
td a{font-weight:700;color:white;text-decoration:none}
td a:hover{color:var(--aqua);text-decoration:underline}
.right{text-align:right;font-variant-numeric:tabular-nums}
.empty{padding:25px;color:var(--cream);border:1px solid var(--stroke);border-radius:8px;background:rgba(4,20,26,.65);line-height:1.6}
.fine-print{color:var(--muted);font-size:12px;line-height:1.6;margin-top:28px}
footer{border-top:1px solid rgba(36,224,194,.25);padding:28px 0;color:#ddd5b5;font-size:13px}
@media(max-width:700px){header{padding:22px 0}.header-logo{width:90px;height:90px}.page-name{font-size:14px;letter-spacing:3px}.hero{padding:19px 12px}.hero-grid{grid-template-columns:minmax(0,1fr) minmax(90px,130px) minmax(0,1fr);gap:9px}.team-logo{width:80px;height:80px}.team-name{font-size:12px}.score{font-size:clamp(27px,7vw,45px)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}.meta{font-size:11px}}

/* Expandable official penalty log */
.penalty-disclosure{border:1px solid var(--stroke);border-radius:10px;background:linear-gradient(145deg,rgba(9,36,44,.9),rgba(6,22,29,.96));overflow:hidden}
.penalty-disclosure summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:19px 21px;color:var(--cream);font-size:15px;font-weight:900;letter-spacing:.5px}
.penalty-disclosure summary::-webkit-details-marker{display:none}
.penalty-disclosure summary::after{content:'+';font-size:28px;line-height:.7;color:var(--aqua)}
.penalty-disclosure[open] summary::after{content:'–'}
.penalty-disclosure summary:hover,.penalty-disclosure summary:focus-visible{background:rgba(36,224,194,.07);color:var(--aqua)}
.penalty-total-line{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:0}
.penalty-body{padding:0 20px 21px;border-top:1px solid rgba(255,255,255,.08)}
.penalty-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.penalty-box{min-width:0}
.penalty-box h3{font-size:15px;color:var(--cream);font-weight:900;text-transform:uppercase;margin:2px 0 12px}
.penalty-box h3 span{font-weight:600;color:var(--aqua);font-size:12px;text-transform:none}
.penalty-box .table-wrap{overflow-x:auto}
.penalty-box table{min-width:420px;font-size:12px}
.penalty-box th,.penalty-box td{padding:11px 9px}
.penalty-box .none{padding:18px 10px;color:var(--muted);font-size:13px}
.penalty-note{margin:15px 0 0;color:var(--muted);font-size:12px;line-height:1.65}
@media(max-width:850px){.penalty-grid{grid-template-columns:1fr}.penalty-disclosure summary{flex-wrap:wrap}.penalty-total-line{width:100%}.penalty-box table{min-width:390px}}

/* Goal-by-goal match timeline: expandable like the penalty summary */
.goal-disclosure{border:1px solid var(--stroke);border-radius:10px;background:linear-gradient(145deg,rgba(9,36,44,.92),rgba(6,22,29,.97));overflow:hidden}
.goal-disclosure summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:19px 21px;color:var(--cream);font-size:15px;font-weight:900}
.goal-disclosure summary::-webkit-details-marker{display:none}
.goal-disclosure summary::after{content:'+';color:var(--aqua);font-size:28px;line-height:.7}
.goal-disclosure[open] summary::after{content:'–'}
.goal-disclosure summary:hover,.goal-disclosure summary:focus-visible{background:rgba(36,224,194,.075);color:var(--aqua)}
.goal-summary-stats{margin-left:auto;text-align:right;color:var(--muted);font-size:12px;font-weight:600}
.goal-body{padding:15px 21px 23px;border-top:1px solid rgba(255,255,255,.09)}
.goal-period{font-size:12px;font-weight:900;letter-spacing:1.8px;text-transform:uppercase;color:var(--cream);padding:17px 0 9px}
.goal-events{position:relative}
.goal-event{display:grid;grid-template-columns:73px minmax(0,1fr) auto;gap:16px;align-items:start;border-left:2px solid rgba(36,224,194,.25);padding:14px 0 16px 17px;margin-left:5px;position:relative;border-bottom:1px solid rgba(255,255,255,.075)}
.goal-event:last-child{border-bottom:0}
.goal-event::before{content:'';position:absolute;left:-7px;top:21px;width:11px;height:11px;background:var(--aqua);border-radius:50%;box-shadow:0 0 0 3px #092831}
.goal-event.opponent::before{background:var(--cream)}
.goal-clock{font-size:14px;font-weight:900;color:var(--cream);font-variant-numeric:tabular-nums;padding-top:1px}
.goal-info{min-width:0;overflow-wrap:anywhere}
.goal-scorer{font-size:15px;font-weight:900}
.goal-scorer a{color:#fff;text-decoration:none}
.goal-scorer a:hover{color:var(--aqua);text-decoration:underline}
.goal-for{margin-top:5px;font-size:12px;font-weight:800;color:var(--aqua)}
.goal-event.opponent .goal-for{color:var(--cream)}
.goal-assists,.goal-flag{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.5}
.goal-flag{color:#e6ce9e}
.goal-scoreline{font-size:19px;font-weight:900;color:var(--cream);font-variant-numeric:tabular-nums;white-space:nowrap}
.goal-type{display:inline-block;border-radius:3px;border:1px solid rgba(36,224,194,.32);padding:3px 7px;font-weight:900;font-size:10px;letter-spacing:.6px;color:var(--aqua);text-transform:uppercase;margin-left:5px}
.goal-disclaimer{color:var(--muted);font-size:12px;line-height:1.6;margin-top:16px}
@media(max-width:700px){.goal-disclosure summary{padding:16px 14px;flex-wrap:wrap}.goal-summary-stats{width:100%;text-align:left;margin-left:0}.goal-body{padding:10px 13px 18px}.goal-event{grid-template-columns:60px minmax(0,1fr);gap:9px;padding-left:13px}.goal-scoreline{grid-column:2;font-size:15px}.goal-scorer{font-size:14px}.goal-clock{font-size:12px}}


/* Optional match gallery – appears only where numbered photos exist */
.match-gallery{margin-top:38px}
.match-gallery[hidden],.photo-lightbox[hidden]{display:none !important}
.photo-gallery-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:15px}
.photo-gallery-heading .section-heading{margin:0}
.photo-gallery-count{font-size:12px;font-weight:800;letter-spacing:.6px;color:var(--cream)}
.photo-gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.photo-thumb{position:relative;display:block;min-width:0;aspect-ratio:4 / 3;border:1px solid var(--stroke);border-radius:9px;overflow:hidden;cursor:pointer;padding:0;background:#0a2831;color:white}
.photo-thumb img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .2s ease}
.photo-thumb:hover img,.photo-thumb:focus-visible img{transform:scale(1.045)}
.photo-thumb:focus-visible,.gallery-view-all:focus-visible,.photo-lightbox button:focus-visible{outline:3px solid var(--aqua);outline-offset:3px}
.photo-feature-label{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);border-radius:4px;background:rgba(3,19,24,.88);padding:6px 9px;font-size:11px;font-weight:900;line-height:1.2;color:var(--cream);text-align:left}
.photo-gallery-footer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:13px}
.photo-gallery-note{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
.gallery-view-all{border:1px solid var(--stroke);background:#10404b;color:var(--cream);font-size:13px;font-weight:900;border-radius:6px;cursor:pointer;padding:11px 16px}
.gallery-view-all:hover{background:#175c66;color:var(--aqua)}
.photo-lightbox{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:56px 12px 20px;background:rgba(2,10,14,.96)}
.photo-lightbox-close{position:absolute;top:12px;right:16px;width:42px;height:42px;border:1px solid var(--stroke);background:#153d47;border-radius:50%;font-size:28px;line-height:1;color:#fff;cursor:pointer}
.photo-lightbox-stage{display:grid;grid-template-columns:42px minmax(0,1fr) 42px;align-items:center;gap:10px;width:min(1100px,100%);height:min(79vh,790px)}
.photo-lightbox-arrow{width:42px;height:58px;border:1px solid var(--stroke);background:#153d47;color:#fff;border-radius:8px;font-size:32px;cursor:pointer}
.photo-lightbox-arrow:hover,.photo-lightbox-close:hover{color:var(--aqua);background:#185865}
.photo-lightbox-figure{margin:0;min-width:0;min-height:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.photo-lightbox-image{display:block;max-width:100%;max-height:calc(100% - 40px);width:auto;height:auto;object-fit:contain;border-radius:4px}
.photo-lightbox-caption{color:var(--cream);text-align:center;font-size:13px;font-weight:800}
body.photo-gallery-open{overflow:hidden}
@media(max-width:700px){.photo-gallery-grid{gap:6px}.photo-thumb{aspect-ratio:1 / 1}.photo-feature-label{font-size:9px;left:4px;bottom:4px;padding:4px 5px}.photo-lightbox-stage{grid-template-columns:34px minmax(0,1fr) 34px;gap:3px}.photo-lightbox-arrow{width:34px;height:48px;font-size:25px}.photo-gallery-heading .section-heading{font-size:20px}}

</style>
</head>
<body>
<header><div class="container header-content"><div><div class="site-title">MK Thunder</div><div class="page-name">Match Centre</div></div><img src="thunder-logo.png" alt="MK Thunder logo" class="header-logo"></div></header>
<nav><div class="container nav-inner"><a href="index.html">Home</a><a href="fixtures.html">Fixtures</a><a href="results.html" class="active">Results</a><a href="players.html">Players</a><a href="stats.html">Stats</a><a href="tables.html">Tables</a><a href="about.html">About</a></div></nav>
<main><div class="container"><a class="back" href="results.html">&larr; Back to all results</a><div id="match-content" aria-live="polite"><div class="empty">Loading match report...</div></div></div></main>
<footer><div class="container">MK Thunder Stats Centre &middot; Independent fan statistics site &middot; 2026/27</div></footer>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(() => {
  'use strict';
  const el = document.getElementById('match-content');
  const id = new URLSearchParams(window.location.search).get('id');
  const esc = value => String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const n = value => value !== '' && value != null && Number.isFinite(Number(value)) ? Number(value) : 0;
  const rows = (wb, name) => wb.Sheets[name] ? XLSX.utils.sheet_to_json(wb.Sheets[name],{range:2,defval:''}).map(r => {
    const clean={}; Object.keys(r).forEach(k=>clean[String(k).trim()]=r[k]); return clean;
  }) : [];
  const validLogo = v => {
    const s=String(v||'').trim();
    return s && !/^(?:javascript|data|vbscript):/i.test(s) && (!/^[a-z][\w+.-]*:/i.test(s) || /^https?:\/\//i.test(s)) ? s : '';
  };
  const mkDate = v => {
    if(v instanceof Date) return v;
    if(typeof v==='number'){
      const d=XLSX.SSF.parse_date_code(v); if(d) return new Date(Date.UTC(d.y,d.m-1,d.d));
    }
    const s=String(v||'').trim(), m=s.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{2,4})$/);
    if(m){ const months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
      const yy=Number(m[3]); return new Date(Date.UTC(yy<100?2000+yy:yy, months[m[2]], Number(m[1]))); }
    return new Date(s);
  };
  const duration = v => { const s=Math.max(0,Math.round(n(v)*60));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };
  const cap = (s) => String(s||'').trim();
  const badge = s => '<span class="tag">'+esc(s)+'</span>';
  const showError = (message) => {el.innerHTML='<div class="empty">'+esc(message)+' <a href="results.html">Go back to Results</a>.</div>';};
  // GitHub Pages cannot list folders, so check photos/G001/01.jpg ... 12.jpg.
  // A game without photos produces no gallery, and no Excel edits are needed.
  function loadMatchGallery(gameId, opponentName){
    const section=document.getElementById('match-gallery');
    if(!section || !/^G\d{3,6}$/i.test(gameId)) return;
    const folder='photos/'+gameId.toUpperCase()+'/';
    const possible=Array.from({length:12},(_,i)=>folder+String(i+1).padStart(2,'0')+'.jpg');
    Promise.all(possible.map(async url=>{
      try{
        const response=await fetch(url,{method:'HEAD',cache:'no-store'});
        const mime=response.headers && response.headers.get('content-type') || '';
        return response.ok && /^image\//i.test(mime) ? url : null;
      }catch{return null;}
    })).then(found=>{
      const photos=found.filter(Boolean);
      if(!photos.length) return;
      const count=photos.length;
      const photoAlt=index=>'MK Thunder v '+opponentName+', match photo '+(index+1)+' of '+count;
      const thumbs=photos.slice(0,3).map((src,index)=>
        '<button type="button" class="photo-thumb" data-photo-index="'+index+'" aria-label="Open match photo '+(index+1)+' of '+count+'">'+
        '<img src="'+esc(src)+'" loading="lazy" alt="'+esc(photoAlt(index))+'">'+
        (index===0?'<span class="photo-feature-label">Photo of the Match</span>':'')+
        '</button>'
      ).join('');
      section.innerHTML='<div class="photo-gallery-heading"><h2 class="section-heading">&#128247; Match gallery</h2><span class="photo-gallery-count">'+count+' photo'+(count===1?'':'s')+'</span></div>'+
        '<div class="photo-gallery-grid">'+thumbs+'</div>'+
        '<div class="photo-gallery-footer"><p class="photo-gallery-note">Photo 01 is your Photo of the Match. Click a picture to enlarge it.</p>'+
        (count>3?'<button type="button" class="gallery-view-all">View all '+count+' match photos &rsaquo;</button>':'')+'</div>';
      section.hidden=false;

      const dialog=document.createElement('div');
      dialog.className='photo-lightbox';
      dialog.hidden=true;
      dialog.setAttribute('role','dialog');
      dialog.setAttribute('aria-modal','true');
      dialog.setAttribute('aria-label','Match photo viewer');
      dialog.innerHTML='<button type="button" class="photo-lightbox-close" aria-label="Close photo viewer">&times;</button>'+
        '<div class="photo-lightbox-stage">'+
        '<button type="button" class="photo-lightbox-arrow photo-lightbox-prev" aria-label="Previous photo">&#8249;</button>'+
        '<figure class="photo-lightbox-figure"><img class="photo-lightbox-image" alt=""><figcaption class="photo-lightbox-caption"></figcaption></figure>'+
        '<button type="button" class="photo-lightbox-arrow photo-lightbox-next" aria-label="Next photo">&#8250;</button>'+
        '</div>';
      document.body.appendChild(dialog);
      const enlarged=dialog.querySelector('.photo-lightbox-image');
      const caption=dialog.querySelector('.photo-lightbox-caption');
      const closeButton=dialog.querySelector('.photo-lightbox-close');
      const previousButton=dialog.querySelector('.photo-lightbox-prev');
      const nextButton=dialog.querySelector('.photo-lightbox-next');
      let current=0, previousFocus=null, touchStartX=null;
      function show(index){
        current=(index+count)%count;
        enlarged.src=photos[current];
        enlarged.alt=photoAlt(current);
        caption.textContent='Photo '+(current+1)+' of '+count+(current===0?' · Photo of the Match':'');
        previousButton.disabled=nextButton.disabled=count===1;
      }
      function open(index){
        previousFocus=document.activeElement;
        show(index);
        dialog.hidden=false;
        document.body.classList.add('photo-gallery-open');
        closeButton.focus();
      }
      function close(){
        dialog.hidden=true;
        document.body.classList.remove('photo-gallery-open');
        enlarged.removeAttribute('src');
        if(previousFocus && previousFocus.isConnected) previousFocus.focus();
      }
      section.querySelectorAll('[data-photo-index]').forEach(button=>{
        button.addEventListener('click',()=>open(Number(button.dataset.photoIndex)));
      });
      section.querySelector('.gallery-view-all')?.addEventListener('click',()=>open(0));
      closeButton.addEventListener('click',close);
      previousButton.addEventListener('click',()=>show(current-1));
      nextButton.addEventListener('click',()=>show(current+1));
      dialog.addEventListener('click',event=>{if(event.target===dialog)close();});
      dialog.addEventListener('keydown',event=>{
        if(event.key==='Escape'){event.preventDefault();close();}
        if(event.key==='ArrowLeft'){event.preventDefault();show(current-1);}
        if(event.key==='ArrowRight'){event.preventDefault();show(current+1);}
        if(event.key==='Tab'){
          const controls=[closeButton,previousButton,nextButton].filter(node=>!node.disabled);
          const position=controls.indexOf(document.activeElement);
          if(event.shiftKey && position<=0){event.preventDefault();controls[controls.length-1].focus();}
          else if(!event.shiftKey && position===controls.length-1){event.preventDefault();controls[0].focus();}
        }
      });
      dialog.addEventListener('touchstart',event=>{touchStartX=event.changedTouches[0]?.screenX??null;},{passive:true});
      dialog.addEventListener('touchend',event=>{
        if(touchStartX==null)return;
        const dx=(event.changedTouches[0]?.screenX??touchStartX)-touchStartX;
        if(Math.abs(dx)>50)show(current+(dx<0?1:-1));
        touchStartX=null;
      },{passive:true});
    }).catch(error=>console.warn('Optional match photos unavailable:',error));
  }

  if(!id || !/^G\d{3,6}$/i.test(id)){showError('Choose a match from the Results page to see its report.');return;}
  fetch('MK_Thunder_Stats_Master.xlsx?v='+Date.now(),{cache:'no-store'})
    .then(r => {if(!r.ok)throw new Error('The Excel master could not be loaded');return r.arrayBuffer();})
    .then(buffer => {
      const wb=XLSX.read(buffer,{type:'array',cellDates:true});
      const games=rows(wb,'Games');
      const teams=rows(wb,'Teams');
      const players=rows(wb,'Players');
      const game=games.find(r=>cap(r['Game ID']).toUpperCase()===id.toUpperCase());
      if(!game){showError('That match is not in the current master spreadsheet.');return;}
      const thunder=teams.find(t=>cap(t['Team ID'])==='T001')||{};
      const opponent=teams.find(t=>cap(t['Team ID'])===cap(game['Opponent ID']))||{};
      const home=cap(game['H/A']).toUpperCase()==='H';
      const ts=game['Thunder Score'], os=game['Opponent Score'];
      const complete=ts!==''&&ts!=null&&os!==''&&os!=null;
      const tScore=n(ts),oScore=n(os);
      const tName='MK Thunder',oName=cap(opponent['Team Name'])||'Opponent';
      const tLogo=validLogo(thunder['Logo file'])||'thunder-logo.png',oLogo=validLogo(opponent['Logo file']);
      const left={name:home?tName:oName,logo:home?tLogo:oLogo,score:home?tScore:oScore};
      const right={name:home?oName:tName,logo:home?oLogo:tLogo,score:home?oScore:tScore};
      const formatted=mkDate(game['Date']);
      const date=Number.isNaN(formatted.getTime())?'Date unavailable':formatted.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:'UTC'});
      const type=cap(game['OT/SO?']).toUpperCase();
      const ended=type==='SO'?'After shootout':type==='OT'?'After overtime':'Full time';
      const outcome=cap(game['Result']) || (tScore>oScore?'W':tScore<oScore?'L':'T');
      const resultWord=outcome.toUpperCase().startsWith('W')?'won':outcome.toUpperCase().startsWith('L')?'lost':'drew';
      const goalieRows=rows(wb,'Netminder Stats').filter(r=>cap(r['Game ID']).toUpperCase()===id.toUpperCase() && cap(r['Player ID']));
      const pRows=rows(wb,'Player Game Stats').filter(r=>cap(r['Game ID']).toUpperCase()===id.toUpperCase() && cap(r['Player ID']));
      const penaltyRows=rows(wb,'Penalties').filter(r=>cap(r['Game ID']).toUpperCase()===id.toUpperCase());
      const goalRows=rows(wb,'Goals').filter(r=>cap(r['Game ID']).toUpperCase()===id.toUpperCase())
        .sort((a,b)=>n(a['Sequence'])-n(b['Sequence']));
      const goalImportReady=rows(wb,'Goal Import Log').some(r=>cap(r['Game ID']).toUpperCase()===id.toUpperCase());
      const penaltyImportReady=rows(wb,'Penalty Import Log').some(r=>cap(r['Game ID']).toUpperCase()===id.toUpperCase());
      const byId = new Map(players.map(p=>[cap(p['Player ID']),p]));
      const skaters=pRows.filter(r=>cap(byId.get(cap(r['Player ID']))?.['Position']).toLowerCase()!=='netminder');
      const sorted=skaters.slice().sort((a,b)=>(n(b['Points'])||n(b['Goals'])+n(b['Assists']))-(n(a['Points'])||n(a['Goals'])+n(a['Assists']))||n(b['Goals'])-n(a['Goals'])||cap(a['Player Name']).localeCompare(cap(b['Player Name'])));
      const linkPlayer = r => {
        const pid=cap(r['Player ID']);const player=byId.get(pid)||{};
        const name=cap(player['Name'])||cap(r['Player Name'])||cap(r['Netminder'])||'Player';
        return /^P\d{3,6}$/i.test(pid) ? '<a href="player.html?id='+encodeURIComponent(pid)+'">'+esc(name)+'</a>' : esc(name);
      };
      const logo = team => team.logo?'<img class="team-logo" src="'+esc(team.logo)+'" alt="'+esc(team.name)+' logo">':'<div class="team-logo"></div>';
      document.title=(complete ? left.score+'–'+right.score+' | ' : '')+left.name+' v '+right.name+' | MK Thunder Stats Centre';
      const recap=complete ? 'MK Thunder '+resultWord+' '+tScore+'–'+oScore+' against '+oName+(type==='OT'?' after overtime':type==='SO'?' after a shootout':'')+'.' : 'The result has not been entered for this fixture yet.';
      let output='<section class="hero"><div class="meta">'+esc(date)+' &nbsp;·&nbsp; '+esc(game['Competition']||'Match')+'</div>'+
        '<div class="hero-grid"><div class="team">'+logo(left)+'<div class="team-name">'+esc(left.name)+'</div></div>'+
        '<div><div class="final">'+(complete?ended:'Fixture')+'</div><div class="score">'+(complete?left.score+' – '+right.score:'vs')+'</div></div>'+
        '<div class="team">'+logo(right)+'<div class="team-name">'+esc(right.name)+'</div></div></div>'+
        '<div class="tags">'+badge(home?'Home':'Away')+(cap(game['Competition'])?badge(game['Competition']):'')+(complete?badge('Thunder '+(outcome.toUpperCase().startsWith('W')?'win':outcome.toUpperCase().startsWith('L')?'loss':'draw')):'')+'</div>'+
        '<p class="summary">'+esc(recap)+(cap(game['Venue'])?' &nbsp;·&nbsp; '+esc(game['Venue']):'')+'</p></section>';
      if(!complete){el.innerHTML=output+'<p class="fine-print">This match will appear as a completed report when the result is entered into the master workbook.</p>';return;}
      if(!skaters.length && !goalieRows.length){
        el.innerHTML=output+'<h2 class="section-heading">Match statistics</h2><div class="empty">The result is available, but player and netminder statistics for this game have not yet been imported into the master workbook. They will appear here automatically after the next stats update.</div><section id="match-gallery" class="match-gallery" hidden></section>';
        loadMatchGallery(id,oName);
        return;
      }
      const totalGoals=skaters.reduce((a,r)=>a+n(r['Goals']),0);
      const totalAssists=skaters.reduce((a,r)=>a+n(r['Assists']),0);
      const totalPim=skaters.reduce((a,r)=>a+n(r['PIM']),0);
      const contrib=skaters.filter(r=>n(r['Goals'])+n(r['Assists'])>0).length;
      output+='<div class="stats">'+[
        ['Thunder goals recorded',totalGoals],['Assists recorded',totalAssists],['Scoring players',contrib],['Player penalty mins',totalPim]
      ].map(([label,val])=>'<div class="stat"><div class="stat-val">'+esc(val)+'</div><div class="stat-label">'+esc(label)+'</div></div>').join('')+'</div>';
      const scorer = skaters.filter(r=>n(r['Goals'])>0).sort((a,b)=>n(b['Goals'])-n(a['Goals']));
      const assists = skaters.filter(r=>n(r['Assists'])>0).sort((a,b)=>n(b['Assists'])-n(a['Assists']));
      const playerList=(arr,col) => arr.length?arr.map(r=>'<div class="scoring-row"><span>'+linkPlayer(r)+'</span><span class="qty">'+n(r[col])+'</span></div>').join(''):'<p class="muted">None recorded</p>';
      if(skaters.length){
        output+='<h2 class="section-heading">Thunder scoring</h2><div class="two-col"><section class="panel"><h3>Goalscorers</h3>'+playerList(scorer,'Goals')+'</section><section class="panel"><h3>Assist providers</h3>'+playerList(assists,'Assists')+'</section></div>';

        // Official goal events. Preserve the PDF sequence and flag time/period discrepancies.
        output+='<h2 class="section-heading">Goal-by-goal timeline</h2>';
        if(goalImportReady && goalRows.length){
          const goalTags={E:'Even strength',PP:'Power play',SH:'Short-handed',PS:'Penalty shot',SO:'Shootout'};
          const periods={1:'First period',2:'Second period',3:'Third period',4:'Overtime',5:'Shootout'};
          const mkG=goalRows.filter(r=>cap(r['Team']).toLowerCase()==='mk thunder' && cap(r['Goal Type'])!=='SO').length;
          const oppG=goalRows.filter(r=>cap(r['Team']).toLowerCase()!=='mk thunder' && cap(r['Goal Type'])!=='SO').length;
          const soG=goalRows.filter(r=>cap(r['Goal Type'])==='SO').length;
          let timeline='',lastPeriod=null;
          goalRows.forEach(g=>{
            const period=n(g['Timeline Period'])||n(g['PDF Period'])||1;
            if(period!==lastPeriod){timeline+='<div class="goal-period">'+esc(periods[period]||'Period '+period)+'</div>';lastPeriod=period;}
            const isMK=cap(g['Team']).toLowerCase()==='mk thunder';
            const scorer=cap(g['Goalscorer'])||'Unknown scorer';
            const pId=cap(g['Player ID']);
            const scorerLink=isMK && /^P\d{3,6}$/i.test(pId)
              ? '<a href="player.html?id='+encodeURIComponent(pId)+'">'+esc(scorer)+'</a>':esc(scorer);
            const asst=[cap(g['Assist 1']),cap(g['Assist 2'])].filter(Boolean);
            const goalType=cap(g['Goal Type']);
            const details=asst.length?'Assists: '+asst.join(', '):(goalType==='SO'?'':'Unassisted');
            const tag=goalType && goalType!=='E'?'<span class="goal-type">'+esc(goalTags[goalType]||goalType)+'</span>':'';
            timeline+='<div class="goal-event '+(isMK?'thunder':'opponent')+'">'+
              '<div class="goal-clock">'+esc(g['Time'])+'</div>'+
              '<div class="goal-info"><div class="goal-scorer">'+scorerLink+tag+'</div>'+
              '<div class="goal-for">'+esc(isMK?'MK Thunder':oName)+'</div>'+
              (details?'<div class="goal-assists">'+esc(details)+'</div>':'')+
              (goalType==='SO'?'<div class="goal-flag">Shootout-deciding attempt; not counted as a player goal.</div>':'')+
              (cap(g['Notes']) && goalType!=='SO'?'<div class="goal-flag">Source note: '+esc(g['Notes'])+'</div>':'')+
              '</div><div class="goal-scoreline">'+esc(String(g['Score']||'').replace('-','–'))+'</div></div>';
          });
          output+='<details class="goal-disclosure"><summary><span>View goal-by-goal timeline</span><span class="goal-summary-stats">'+
            mkG+' Thunder goals · '+oppG+' '+esc(oName)+' goals'+(soG?' · Shootout included':'')+
            '</span></summary><div class="goal-body"><div class="goal-events">'+timeline+'</div>'+
            '<p class="goal-disclaimer">Scores follow home–away order from the official PDF; times are elapsed match times. If a period and time conflict in the PDF, the time determines the timeline period and the source discrepancy is flagged. A shootout decider is not counted as a player goal.</p></div></details>';
        }else{
          output+='<div class="empty">Goal-by-goal details have not been imported for this match yet. Other available match statistics remain visible.</div>';
        }

        output+='<h2 class="section-heading">Full Thunder player stats</h2><div class="table-wrap"><table><thead><tr><th>Player</th><th class="right">#</th><th class="right">G</th><th class="right">A</th><th class="right">PTS</th><th class="right">PIM</th></tr></thead><tbody>'+
        sorted.map(r=>{const p=byId.get(cap(r['Player ID']))||{};
          return '<tr><td>'+linkPlayer(r)+'</td><td class="right">'+esc(p['Number']??'—')+'</td><td class="right">'+n(r['Goals'])+'</td><td class="right">'+n(r['Assists'])+'</td><td class="right">'+(n(r['Goals'])+n(r['Assists']))+'</td><td class="right">'+n(r['PIM'])+'</td></tr>';}).join('')+'</tbody></table></div>';
      }
      if(goalieRows.length){
        output+='<h2 class="section-heading">Netminder performance</h2><div class="table-wrap"><table><thead><tr><th>Netminder</th><th class="right">Time on ice</th><th class="right">Shots</th><th class="right">Saves</th><th class="right">GA</th><th class="right">Save %</th><th class="right">Decision</th></tr></thead><tbody>'+
        goalieRows.map(r=>{const shots=n(r['Shots Against']),saves=n(r['Saves']);return '<tr><td>'+linkPlayer(r)+'</td><td class="right">'+duration(r['Minutes'])+'</td><td class="right">'+shots+'</td><td class="right">'+saves+'</td><td class="right">'+n(r['Goals Against'])+'</td><td class="right">'+(shots?(100*saves/shots).toFixed(1)+'%':'—')+'</td><td class="right">'+esc(r['Decision']||'—')+'</td></tr>';}).join('')+'</tbody></table></div>';
      }
      // The detailed events are kept separate from the original player-match totals.
      output+='<h2 class="section-heading">Match penalties</h2>';
      if(penaltyImportReady){
        const mkPen=penaltyRows.filter(r=>cap(r['Team']).toLowerCase()==='mk thunder');
        const oppPen=penaltyRows.filter(r=>cap(r['Team']).toLowerCase()!=='mk thunder');
        const penaltySort=(a,b)=>n(a['Period'])-n(b['Period']) || (
           (Number(String(a['Time']).split(':')[0])||0)*60+(Number(String(a['Time']).split(':')[1])||0)
          )-(
           (Number(String(b['Time']).split(':')[0])||0)*60+(Number(String(b['Time']).split(':')[1])||0)
          );
        const penaltyTable=(items,title) => {
          const pims=items.reduce((acc,r)=>acc+n(r['PIM']),0);
          const table=items.length?'<div class="table-wrap"><table><thead><tr><th>Period</th><th>Time</th><th>Player</th><th>Offence</th><th class="right">PIM</th></tr></thead><tbody>'+
            items.slice().sort(penaltySort).map(r=>{
               const period=n(r['Period'])===4?'OT':n(r['Period'])===3?'3rd':n(r['Period'])===2?'2nd':'1st';
               return '<tr><td>'+period+'</td><td>'+esc(r['Time']||'—')+'</td><td>'+esc(r['Player / Bench']||'—')+'</td><td>'+esc(r['Penalty']||'—')+'</td><td class="right">'+n(r['PIM'])+'</td></tr>';
            }).join('')+'</tbody></table></div>':'<div class="none">No penalties recorded for this team.</div>';
          return '<section class="penalty-box"><h3>'+esc(title)+' <span>· '+pims+' penalty minutes</span></h3>'+table+'</section>';
        };
        const mkPim=mkPen.reduce((a,r)=>a+n(r['PIM']),0);
        const oppPim=oppPen.reduce((a,r)=>a+n(r['PIM']),0);
        output+='<details class="penalty-disclosure"><summary><span>View match penalties</span><span class="penalty-total-line">Thunder '+mkPim+' PIM · '+esc(oName)+' '+oppPim+' PIM</span></summary><div class="penalty-body"><div class="penalty-grid">'+penaltyTable(mkPen,'MK Thunder')+penaltyTable(oppPen,oName)+'</div><p class="penalty-note">Times are elapsed game times from the official weekly NIHL statistics PDF. Bench penalties are included when listed. These event records are separate from the player-statistics PIM totals.</p></div></details>';
      }else{
        output+='<div class="empty">Detailed penalty-by-penalty records have not yet been imported for this match.</div>';
      }
      output+='<section id="match-gallery" class="match-gallery" hidden></section>';
      output+='<p class="fine-print">Statistics are shown as currently entered in the MK Thunder master spreadsheet. Player penalty minutes exclude separate team/bench penalties. Goalscorers are listed by total goals, not in scoring order; the goal-by-goal timeline is available for imported matches. Official PDF discrepancies are documented in the Goal Import Log and Penalty Import Log worksheets.</p>';
      el.innerHTML=output;
      loadMatchGallery(id,oName);
    })
    .catch(err=>{console.error('Match Centre error:',err);showError('Could not load match statistics from the Excel workbook.');});
})();
</script>
</body>
</html>
